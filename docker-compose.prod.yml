# Déploiement self-host (VPS, Oracle Cloud, Hetzner…) — issue #543
#
# Prérequis : un `.env` rempli à côté de ce fichier (voir `.env.example` et
# `docs/dev/hosting.md`). Il fournit à la fois l'environnement des conteneurs et
# les valeurs interpolées ci-dessous (`DB_USER`, `DB_PASSWORD`, `DB_DATABASE`,
# `APP_DOMAIN`, `LETSENCRYPT_EMAIL`). `APP_URL` doit valoir l'URL publique
# HTTPS ; `DB_HOST` et `HOST` sont forcés plus bas, quoi qu'il contienne.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# ⚠️ Une seule instance `web` : le transport Transmit est `null`
# (config/transmit.ts), les événements SSE ne sont donc pas partagés entre
# processus — deux réplicas web = des notifications perdues une fois sur deux.

x-app: &app
  image: ghcr.io/malolebrin/boat-management:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    # Écrasent le `.env` (précédence `environment` > `env_file`) : dans un
    # conteneur, Postgres est joignable par le nom du service et le serveur doit
    # écouter sur toutes les interfaces, pas sur `localhost`.
    DB_HOST: postgres
    HOST: 0.0.0.0
  depends_on:
    postgres:
      condition: service_healthy
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot exécuté avant `web` et les workers (#542) : un déploiement sur base
  # vierge, ou incluant une nouvelle migration, n'a besoin d'aucune intervention.
  # `restart: no` — un `migration:run` qui échoue doit faire échouer le déploiement.
  #
  # Les seeders de catalogue (bateaux #571, moteurs #573, équipements #577,
  # voileries #578) s'enchaînent derrière : ce sont des référentiels métier, pas
  # des données de démo, et ils sont idempotents (`updateOrCreate` sur le slug,
  # jamais de `delete`) — les rejouer à chaque déploiement met les corpus à jour
  # sans doublon.
  migrator:
    image: ghcr.io/malolebrin/boat-management:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      # DDL long : pas de statement_timeout (0 = illimité, #854)
      DB_STATEMENT_TIMEOUT_MS: 0
    command:
      - sh
      - -c
      - node ace migration:run --force && node ace db:seed --files=database/seeders/boat_catalog_seeder.js --force && node ace db:seed --files=database/seeders/engine_catalog_seeder.js --force && node ace db:seed --files=database/seeders/equipment_catalog_seeder.js --force && node ace db:seed --files=database/seeders/sail_loft_seeder.js --force
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    <<: *app
    # Le scheduler (start/scheduler.ts) n'est préchargé que dans
    # l'environnement `web` : c'est ce conteneur qui met les jobs cron en file.
    expose:
      - '3333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3333/up || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Toutes les queues sauf `ai` : sans ce worker, mails, médias, exports
  # et notifications push ne partent jamais — `queue:work`
  # sans `--queue` ne traite que `default`.
  worker:
    <<: *app
    # Imports/exports : timeouts plus longs que le web (30s / 60s) — #854
    # (un `environment:` local remplace celui de `x-app`, d'où la reprise des clés.)
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      HOST: 0.0.0.0
      DB_STATEMENT_TIMEOUT_MS: 300000
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: 120000
    command: ['node', 'ace', 'queue:work', '--queue=default,emails,media,exports,push']

  # Queue `ai` isolée : les jobs Mistral durent des dizaines de secondes et
  # monopoliseraient la concurrence du worker principal.
  worker-ai:
    <<: *app
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      HOST: 0.0.0.0
      DB_STATEMENT_TIMEOUT_MS: 300000
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: 120000
    command: ['node', 'ace', 'queue:work', '--queue=ai']

  # Sauvegardes PostgreSQL (#847) — procédure complète : docs/dev/runbook.md.
  # Dump quotidien compressé dans le volume `pg_backups`, rotation
  # 7 jours / 4 semaines / 6 mois (dossiers daily/, weekly/, monthly/).
  # Le hook `10-verify-dump` fait échouer la sauvegarde si le dump est absent,
  # vide, corrompu ou tronqué : « ERREUR » dans les logs du conteneur.
  #
  # ⚠️ Ce volume est sur la même machine que `pg_data` : une perte de disque
  # emporte les deux. La copie hors machine (rclone, S3, Backblaze…) est une
  # étape obligatoire du déploiement, pas une option — voir le runbook.
  backup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Sans propriétaire ni droits : le dump se restaure sous n'importe quel rôle.
      POSTGRES_EXTRA_OPTS: -Z6 --no-owner --no-privileges
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      # Un premier dump dès le démarrage : la restauration se teste tout de suite.
      BACKUP_ON_START: 'TRUE'
      # Alerte sur échec : POST vers cette URL. À décommenter seulement avec une
      # valeur — vide, le hook webhook de l'image échoue à chaque sauvegarde.
      # WEBHOOK_ERROR_URL: https://…
    volumes:
      - pg_backups:/backups
      - ./docker/backup/hooks/10-verify-dump:/hooks/10-verify-dump:ro
      - ./scripts/db_restore.sh:/usr/local/bin/db_restore:ro
    # Après le `migrator` : sur une base vierge, un dump d'avant les migrations
    # serait vide et rejeté par le hook — fausse alerte à chaque installation.
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  pg_backups:
  caddy_data:
  caddy_config:
