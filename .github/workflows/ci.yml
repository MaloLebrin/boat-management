name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »), ce qui est
      # arrivé dès que corepack a réécrit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »), ce qui est
      # arrivé dès que corepack a réécrit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Le SW généré doit s'évaluer sans lever, sortir à la racine web avec un
      # scope /, et précacher /offline.html — sinon toute la couche hors-ligne
      # est inopérante en production (#482, #483)
      - name: Garde-fou service worker
        run: pnpm check:sw

  test-backend-shards:
    name: "test-backend (${{ matrix.name }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit-integration
            suites: unit integration
            files: ""
          - name: functional-boats
            suites: functional
            files: "boats/*"
          - name: functional-core
            suites: functional
            # Le flag Japa --files ne supporte pas `**` : chaque filtre matche
            # un segment de chemin (le `*` ne couvre qu'un seul niveau), donc
            # "dossier/*" cible tous les fichiers directement sous ce dossier.
            files: "billing/*,settings/*,marketing/*,auth/*,invoices/*,maintenance/*,ports/*,routing/*"
          - name: functional-other
            suites: functional
            # "functional/contact" et "functional/simulator" ciblent les 2
            # fichiers à la racine de tests/functional/ — un filtre "contact"
            # ou "simulator" seul matcherait aussi des fichiers d'autres
            # dossiers au nom similaire (routing/contact.spec.ts,
            # boats/boat_simulator.spec.ts), d'où l'ancrage sur 2 segments.
            files: "spare_parts/*,ai/*,assistant/*,clients/*,organization/*,quota/*,simulator/*,crew/*,dashboard/*,diagnostic/*,navigation/*,notifications/*,errors/*,health/*,planning/*,pricing/*,push/*,search/*,functional/contact,functional/simulator"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »), ce qui est
      # arrivé dès que corepack a réécrit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: "Backend tests (PostgreSQL) — ${{ matrix.name }}"
        run: node ace test ${{ matrix.suites }} ${{ matrix.files != '' && format('--files={0}', matrix.files) || '' }}
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          APP_NAME: fleetai
          APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://localhost:3333
          LOG_LEVEL: error
          QUEUE_DRIVER: sync
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_DATABASE: test
          AI_PROVIDER: mistral
          MISTRAL_API_KEY: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_SECURE: false
          MAIL_FROM_ADDRESS: noreply@fleetai.app
          MAIL_FROM_NAME: FleetAi

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    needs: [test-backend-shards]
    if: always()
    steps:
      - name: Check backend shard results
        run: |
          if [ "${{ needs.test-backend-shards.result }}" != "success" ]; then
            echo "One or more test-backend shards failed."
            exit 1
          fi

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »), ce qui est
      # arrivé dès que corepack a réécrit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend tests (Vitest)
        run: pnpm test:inertia

  test-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # Pas de `version:` ici : l'action lit `packageManager` de package.json,
      # qui reste la source unique de vérité. Les deux en même temps font
      # échouer le setup (« Multiple versions of pnpm specified »), ce qui est
      # arrivé dès que corepack a réécrit `packageManager` dans package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le binaire Chromium ne dépend que de la version de Playwright, épinglée
      # par le lockfile : sur cache hit, l'install ci-dessous est un no-op.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Pas de --with-deps : sur ubuntu-latest il n'installe aucune bibliothèque
      # système (elles sont déjà présentes), seulement 9 paquets de polices
      # CJK/cyrillique/thaï dont aucun test e2e n'a besoin. En échange il lance
      # un apt-get update qui, quand le miroir azure.archive.ubuntu.com est
      # dégradé, boucle sur des retries pendant plusieurs minutes.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium
      - name: E2E tests (Playwright + Japa browser client)
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          TZ: UTC
          PORT: 3333
          HOST: localhost
          APP_NAME: fleetai
          APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://localhost:3333
          LOG_LEVEL: error
          QUEUE_DRIVER: sync
          SESSION_DRIVER: memory
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_DATABASE: test
          AI_PROVIDER: mistral
          MISTRAL_API_KEY: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_SECURE: false
          MAIL_FROM_ADDRESS: noreply@fleetai.app
          MAIL_FROM_NAME: FleetAi
