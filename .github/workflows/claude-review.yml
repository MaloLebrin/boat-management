name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Une seule review à la fois par PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Jamais sur une PR en draft : la review démarre au passage en « Ready for review ».
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Fais la code review de cette pull request.
            Lis d'abord `CLAUDE.md` : ses règles (injection de dépendances, types dans
            `shared/types`, erreurs dans `app/exceptions`, mutations Inertia, i18n,
            composants Vue < 250 lignes, factories de tests, changelog) font foi.
            Suis aussi la structure de `.claude/agents/reviewer.md`
            (🔴 bloquants, 🟠 importants, 🟡 suggestions, ✅ points positifs, score /10).

            Concentre-toi sur : bugs, sécurité, performance (N+1, index), violations
            d'architecture, tests manquants pour la logique métier.
            Ne commente pas le style déjà couvert par ESLint/Prettier.

            Poste les remarques précises en commentaires inline
            (`mcp__github_inline_comment__create_inline_comment`) et un résumé unique
            avec `gh pr comment`. Réponds en français.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
